# Render Blueprint — 백엔드(Django+Channels) + PostgreSQL만 정의한다.
# 프론트(phase1)는 이미 Render Static Site로 수동 배포돼 있어(mujooin.onrender.com)
# 여기서 새로 만들지 않는다 — 아래 "배포 후 할 일" 참고.
#
# 사용법: Render 대시보드 → New → Blueprint → 이 레포 선택 → 이 파일 자동 인식.
#
# 배포 후 할 일:
#  1) 이 백엔드 서비스가 배포되면 실제 URL(https://<name>.onrender.com, 이름 충돌 시 접미사 붙음)을 확인한다.
#  2) 프론트(mujooin.onrender.com) Render 설정 → Environment에 다음을 추가하고 재배포(redeploy)한다
#     (Vite는 빌드 시점에 값을 박아 넣으므로 재시작이 아니라 재배포가 필요):
#       VITE_API_BASE=https://<백엔드 URL>
#       VITE_WS_BASE=wss://<백엔드 URL>   ← http(s)가 아니라 ws/wss, https 페이지에서는 반드시 wss
#  3) Render 대시보드의 Shell 탭에서 관리자 계정 생성(1회):
#       python manage.py shell -c "from django.contrib.auth import get_user_model; U=get_user_model(); import os; U.objects.create_superuser(username=os.environ['DJANGO_ADMIN_EMAIL'], email=os.environ['DJANGO_ADMIN_EMAIL'], password=os.environ['DJANGO_ADMIN_PASSWORD'])"
#  4) AI 평가받기(LLaMA/Ollama) 기능은 로컬 Ollama가 이 서버에서 안 보이므로 배포 환경에선
#     502로 실패한다 — 별도로 Ollama를 외부에 노출시키거나(터널 등) 다른 LLM API로 바꿔야 동작한다.
#     지금은 알려진 제약으로 남겨둔다.

services:
  - name: mujoobeat-backend
    type: web
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate
    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: CORS_ALLOWED_ORIGINS
        value: https://mujooin.onrender.com
      - key: DJANGO_ADMIN_EMAIL
        sync: false
      - key: DJANGO_ADMIN_PASSWORD
        sync: false
      - key: DB_NAME
        fromDatabase:
          name: mujoobeat-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: mujoobeat-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: mujoobeat-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: mujoobeat-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: mujoobeat-db
          property: port

databases:
  # free 플랜은 생성 30일 후 만료 + 14일 유예 뒤 데이터째로 삭제됨(Render 정책) — 계속
  # 쓸 거면 만료 전에 유료 플랜으로 올려야 한다.
  - name: mujoobeat-db
    plan: free
    region: oregon
